<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>符文戰場 — 淘汰賽選手端</title>
  <link rel="stylesheet" href="common.css">
  <style>
html, body {
      -webkit-text-size-adjust: 100%;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: Inter, system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      width: 100%;
    }

input, select, textarea {
      font-size: 1rem;
    }

.container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 14px 40px;
      overflow-x: hidden;
    }

@media (max-width: 480px) {
      .container {
        padding: 10px 8px 30px;
      }
      .card {
        padding: 12px 10px;
      }
    }

header {
      margin-bottom: 12px;
    }

.header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

.event-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

.badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
    }

.badge.live {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

.nav-links {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

.nav-link {
      display: inline-flex;
      align-items: center;
      color: var(--accent-text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(239, 125, 0, 0.1);
      border: 1px solid rgba(239, 125, 0, 0.25);
    }

.nav-link:active {
      background: rgba(239, 125, 0, 0.2);
    }

.banner {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }

.stale-warning {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

.contract-warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
    }

.card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

.card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

.search-row {
      display: flex;
      gap: 8px;
    }

.input-text {
      flex: 1;
      min-width: 0;
      height: 44px;
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text-primary);
      outline: none;
    }

.input-text:focus {
      border-color: var(--accent);
    }

.btn {
      min-height: 44px;
      min-width: 44px;
      padding: 0 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, opacity 0.15s;
    }

.btn-primary {
      background: var(--accent);
      color: #141212;
    }

.btn-primary:active {
      background: var(--accent-hover);
    }

.btn-secondary {
      background: var(--chip-bg);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
    }

.btn-secondary:active {
      background: var(--card-border);
    }

.btn-danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

.btn-danger:active {
      background: rgba(168, 68, 60, 0.4);
    }

.btn-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

.btn-success:active {
      background: rgba(31, 122, 85, 0.4);
    }

.search-result {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      font-size: 0.95rem;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

.form-group {
      margin-bottom: 10px;
    }

.form-label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

.login-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

.msg-text {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 6px;
      min-height: 1.2rem;
    }

.msg-danger {
      color: var(--danger-text);
    }

.msg-success {
      color: var(--success-text);
    }

.logged-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

.logged-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-text);
    }

.match-box {
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

.match-main-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.4;
    }

.report-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

.report-sub-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

.winner-btns-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

.score-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

.score-select-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

.score-select {
      width: 100%;
      height: 44px;
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 0 10px;
      outline: none;
    }

.score-select:focus {
      border-color: var(--accent);
    }

.report-status-box {
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
    }

.report-status-box.conflict {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

.report-status-box.notice {
      background: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--warning-text);
    }

.report-status-box.success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

.call-judge-card {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--card-border);
    }

.btn-call-judge {
      width: 100%;
      min-height: 44px;
      background: var(--judge-bg);
      border: 1px solid var(--judge-border);
      color: var(--judge-text);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s;
    }

.btn-call-judge:active {
      background: #3e2e54;
    }

.call-reasons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

.btn-reason {
      min-height: 44px;
      min-width: 44px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      padding: 4px 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

.btn-reason.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #141212;
      font-weight: 700;
    }

.call-note-wrap {
      margin-bottom: 10px;
    }

.call-note-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

.call-note-input {
      width: 100%;
      min-height: 44px;
      height: 44px;
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 0 12px;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
    }

.call-note-input:focus {
      border-color: var(--accent);
    }

.call-status-box {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1.5px solid var(--judge-border);
      background: var(--judge-bg);
      color: var(--judge-text);
      text-align: center;
    }

.call-status-box.taken {
      border-color: var(--info-border);
      background: var(--info-bg);
      color: var(--info-text);
    }

.btn-call-cancel {
      margin-top: 10px;
      width: 100%;
      min-height: 44px;
      min-width: 44px;
      background: var(--chip-bg);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
    }

.btn-call-cancel:active {
      background: var(--card-border);
    }

.modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 1000;
    }

.modal-box {
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 12px;
      max-width: 330px;
      width: 100%;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

.modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

.modal-msg {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-text);
      margin-bottom: 16px;
      line-height: 1.5;
    }

.modal-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

.modal-btns .btn {
      flex: 1;
    }

.disconnected-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 2000;
    }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="event-title" id="elimEventName">淘汰賽模式</div>
        <div class="badge live" id="elimEventBadge">進行中</div>
      </div>
      <div class="nav-links">
        <a href="elim-board.html" class="nav-link">📺 大螢幕看板</a>
        <a href="elim-bracket.html" class="nav-link">🏆 賽程樹</a>
      </div>
    </header>

    <!-- 警示橫幅 -->
    <div id="elimStaleWarning" class="banner stale-warning" style="display: none;">
      已超過 90 秒未收到新賽況，可能連線中斷或主機暫停
    </div>
    <div id="elimContractWarning" class="banner contract-warning" style="display: none;">
      系統版本已有更新，請重新整理頁面
    </div>

    <!-- 1. 不用 PIN 查桌次與對手 -->
    <section class="card">
      <div class="card-title">
        <span>🔍 查詢下一場比賽</span>
        <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">免輸入 PIN</span>
      </div>
      <div class="search-row">
        <input type="text" id="elimSearch" class="input-text" placeholder="輸入選手編號或姓名，例如 A-01 或 阿翔" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" id="elimSearchBtn" class="btn btn-primary">查詢</button>
      </div>
      <div id="elimSearchResult" class="search-result">請輸入編號或姓名查詢比賽狀態</div>
    </section>

    <!-- 2. 選手登入（回報專用） -->
    <section class="card" id="elimLoginCard">
      <div class="card-title">
        <span>📱 選手報分登入</span>
        <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: normal;">自報成績專用</span>
      </div>
      <div class="login-row">
        <div class="form-group">
          <label for="elimId" class="form-label">選手編號</label>
          <input type="text" id="elimId" class="input-text" placeholder="例如 A-01" autocomplete="off" autocapitalize="characters" spellcheck="false" style="width: 100%;">
        </div>
        <div class="form-group">
          <label for="elimPin" class="form-label">個人 PIN 碼</label>
          <input type="password" id="elimPin" class="input-text" inputmode="numeric" placeholder="6 位數 PIN" autocomplete="off" style="width: 100%;">
        </div>
        <button type="button" id="elimLogin" class="btn btn-primary" style="width: 100%;">登入</button>
        <div id="elimLoginMsg" class="msg-text msg-danger"></div>
      </div>
    </section>

    <!-- 3. 已登入操作區 -->
    <section class="card" id="elimActiveCard" style="display: none;">
      <div class="logged-bar">
        <span id="elimPlayerInfo" class="logged-name">--</span>
        <button type="button" id="elimLogout" class="btn btn-secondary" style="min-height: 44px; min-width: 44px; padding: 0 14px; font-size: 0.85rem;">登出</button>
      </div>

      <!-- 開賽前名單報到卡片 (snapshot.event.status === 'before') -->
      <div id="playerCheckinCard" class="card" style="display: none; background: rgba(1, 26, 36, 0.85); border: 2px solid var(--accent); margin-bottom: 14px; text-align: center; padding: 18px 14px;">
        <!-- 未報到狀態 -->
        <div id="playerCkUncheckedBox" style="display: none;">
          <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent-text); margin-bottom: 12px;">📋 現場報到</div>
          <div class="form-group" style="text-align: left; margin-bottom: 12px;">
            <label for="playerCkName" class="form-label">顯示名稱（選填）</label>
            <input type="text" id="playerCkName" class="input-text" maxlength="20" placeholder="例如：自訂戰鬥暱稱" style="width: 100%;">
            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">這個名字會出現在大螢幕上</div>
          </div>
          <button type="button" id="playerCkArrive" class="btn btn-success" style="width: 100%; min-height: 52px; font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;">
            我到了
          </button>
        </div>

        <!-- 已報到狀態 -->
        <div id="playerCkCheckedBox" style="display: none;">
          <div style="font-size: 1.3rem; font-weight: 800; color: var(--success-text); margin-bottom: 6px;">
            ✅ 報到完成
          </div>
          <div style="font-size: 1.05rem; color: var(--text-primary); margin-bottom: 12px;">
            選手名稱：<strong id="playerCkDisplayName" style="color: var(--accent-text);"></strong>
          </div>

          <!-- 修改名稱按鈕與表單 -->
          <button type="button" id="playerCkEditNameBtn" class="btn btn-secondary" style="min-height: 44px; padding: 6px 14px; font-size: 0.9rem;">
            修改名稱
          </button>
          <div id="playerCkEditNameForm" style="display: none; margin-top: 12px; text-align: left;">
            <div class="form-group">
              <label for="playerCkNewName" class="form-label">新顯示名稱</label>
              <input type="text" id="playerCkNewName" class="input-text" maxlength="20" placeholder="輸入新的顯示名稱" style="width: 100%;">
              <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">這個名字會出現在大螢幕上</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" id="playerCkSaveNameBtn" class="btn btn-primary" style="flex: 1;">儲存名稱</button>
              <button type="button" id="playerCkCancelNameBtn" class="btn btn-secondary" style="flex: 1;">取消</button>
            </div>
          </div>
        </div>

        <div id="playerCkMsg" class="msg-text" style="display: none; margin-top: 8px;"></div>
      </div>

      <!-- 目前場次卡片 -->
      <div class="match-box" id="elimMatchBox">
        <div id="elimMatch" class="match-main-text">正在載入比賽資訊...</div>
      </div>

      <!-- 報分控制區 -->
      <div class="report-panel" id="elimReportPanel">
        <!-- 方式 A: 只按誰贏 -->
        <div id="elimWinnerSection" style="display: none;">
          <div class="report-sub-title">快速勝負判定：</div>
          <div class="winner-btns-row">
            <button type="button" id="elimIWon" class="btn btn-success">我贏了</button>
            <button type="button" id="elimILost" class="btn btn-danger">我輸了</button>
          </div>
        </div>

        <!-- 方式 B: 比分 -->
        <div id="elimScoreSection" style="display: none;">
          <div class="report-sub-title">比分回報：</div>
          <div id="elimScoreWidgetContainer"></div>
          <button type="button" id="elimScoreSubmit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">送出比分</button>
        </div>

        <!-- 報分狀態與提示 -->
        <div id="elimReportStatus" class="report-status-box">準備就緒</div>
        <div id="elimReportMsg" class="msg-text msg-danger"></div>
      </div>

      <!-- 叫裁判區塊 (DATA-CONTRACT 7.11) -->
      <div id="elimCallSection" class="call-judge-card" style="display: none;">
        <button type="button" id="elimCallBtn" class="btn-call-judge" style="display: none;">🙋 叫裁判</button>
        <div id="elimCallForm" style="display: none;">
          <div style="font-size: 0.9rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">選擇呼叫原因：</div>
          <div class="call-reasons-grid">
            <button type="button" class="btn-reason active" data-reason="rules">規則問題</button>
            <button type="button" class="btn-reason" data-reason="opponent">對手狀況</button>
            <button type="button" class="btn-reason" data-reason="timer">計時或補時</button>
            <button type="button" class="btn-reason" data-reason="cards">卡片或牌組</button>
            <button type="button" class="btn-reason" data-reason="other">其他</button>
          </div>
          <div class="call-note-wrap">
            <div class="call-note-label">
              <span>補充說明（最多 40 字，可留空）</span>
              <span style="color: var(--accent-text);">這段話裁判看得到</span>
            </div>
            <input type="text" id="elimCallNote" class="call-note-input" maxlength="40" placeholder="例如：對手離桌很久">
          </div>
          <button type="button" id="elimCallSubmit" class="btn btn-primary" style="width: 100%; min-height: 44px; margin-top: 4px;">送出呼叫</button>
        </div>
        <div id="elimCallStatus" class="call-status-box" style="display: none;"></div>
        <button type="button" id="elimCallCancel" class="btn btn-secondary btn-call-cancel" style="display: none;">取消呼叫裁判</button>
        <div id="elimCallError" class="msg-text msg-danger" style="display: none; text-align: center;"></div>
      </div>
    </section>
  </div>

  <!-- 頁面內確認彈窗 -->
  <div id="elimConfirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-title">確認送出成績</div>
      <div id="elimConfirmMsg" class="modal-msg">--</div>
      <div class="modal-btns">
        <button type="button" id="elimConfirm" class="btn btn-primary">確認送出</button>
        <button type="button" id="elimCancel" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- 操作確認彈窗（共通 confirmDialog 元件） -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div id="confirmTitle" class="modal-title">操作確認</div>
      <div id="confirmMessage" class="modal-msg"></div>
      <div class="modal-btns">
        <button type="button" id="confirmNo" class="btn btn-secondary" style="min-height: 44px; min-width: 80px;">取消</button>
        <button type="button" id="confirmYes" class="btn btn-danger" style="min-height: 44px; min-width: 80px;">確認</button>
      </div>
    </div>
  </div>

  <!-- 尚未連上賽務主機畫面 -->
  <div class="disconnected-overlay" id="elimDisconnectedScreen">
    <div style="font-size: 3rem; margin-bottom: 12px;">⚠️</div>
    <div style="font-size: 1.4rem; font-weight: 800; color: var(--danger-text); margin-bottom: 8px;">尚未連上賽務主機</div>
    <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px;">請確認主機是否已啟動，或稍候自動重連。</div>
    <button type="button" class="btn btn-primary" onclick="window.poller && window.poller.fetchOnce()">重新連線</button>
  </div>

  <script src="common.js"></script>
  <script src="player-auth.js"></script>
  <script src="call-judge.js"></script>
  <script src="elim-common.js"></script>
  <script>
    let loggedPlayerId = null;
    let loggedPin = null;
    let pendingReportAction = null;
    let activePlayerData = null;
    let isSubmitting = false;

    const playerAuth = PlayerAuth.create({
      post: async (path, body) => {
        try {
          return await callApi(path, body);
        } catch (err) {
          if (!err.retryAfterSec && (err.retry_after_sec || (err.data && err.data.retry_after_sec))) {
            err.retryAfterSec = err.retry_after_sec || (err.data && err.data.retry_after_sec);
          }
          throw err;
        }
      },
      onLogin: (me, { auto }) => {
        const auth = playerAuth.get();
        loggedPlayerId = auth ? auth.player_id : (me.player && me.player.id);
        loggedPin = auth ? auth.pin : null;
        activePlayerData = me;
        renderPlayerView(me);
        showLoginMsg('');
      },
      onLogout: () => {
        loggedPlayerId = null;
        loggedPin = null;
        activePlayerData = null;
        CallJudge.update({ judge_call: null, canCall: false });
        document.getElementById('elimActiveCard').style.display = 'none';
        document.getElementById('elimLoginCard').style.display = 'block';
        const pinIn = document.getElementById('elimPin');
        if (pinIn) pinIn.value = '';
        const idIn = document.getElementById('elimId');
        if (idIn) idIn.value = '';
        showLoginMsg('');
        showReportMsg('');
      },
      now: () => ((typeof poller !== 'undefined' && poller.now) ? poller.now() : Date.now())
    });

    async function refreshPlayerMeSilently() {
      const auth = playerAuth.get();
      if (!auth || !auth.player_id || !auth.pin) return;
      try {
        const res = await callApi('/api/player/me', { player_id: auth.player_id, pin: auth.pin });
        activePlayerData = res;
        playerAuth.setMe(res);
        renderPlayerView(res);
      } catch (err) {
        console.error('淘汰賽背景更新選手失敗:', err);
        if (err.status === 401) {
          playerAuth.logout();
        }
      }
    }

    // 初始化輪詢
    const poller = new ElimPoller({
      onData: (snapshot) => {
        renderHeader(snapshot);
        if (playerAuth.get()) {
          refreshPlayerMeSilently();
        }
      },
      onError: (err) => {
        // 輪詢錯誤不彈窗
      },
      interval: 5000
    });
    window.poller = poller;

    function renderHeader(snapshot) {
      if (!snapshot) return;
      const titleEl = document.getElementById('elimEventName');
      if (titleEl && snapshot.event && snapshot.event.name) {
        titleEl.textContent = snapshot.event.name;
      }
      const badgeEl = document.getElementById('elimEventBadge');
      if (badgeEl && snapshot.event) {
        const st = snapshot.event.status;
        badgeEl.textContent = st === 'done' ? '已結束' : (st === 'before' ? '未開賽' : '進行中');
        badgeEl.className = 'badge ' + (st === 'done' ? '' : 'live');
      }
    }

    // 1. 不用 PIN 查詢功能
    document.getElementById('elimSearchBtn').addEventListener('click', performSearch);
    document.getElementById('elimSearch').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    function performSearch() {
      const query = document.getElementById('elimSearch').value.trim();
      const resultEl = document.getElementById('elimSearchResult');
      if (!query) {
        resultEl.textContent = '請輸入選手編號或姓名';
        return;
      }
      const snap = window.elimSnapshot;
      if (!snap || !snap.divisions) {
        resultEl.textContent = '尚未取得賽事資料，請稍候再試';
        return;
      }

      // 在所有分區與場次中比對選手
      let foundId = null;
      let foundName = null;
      const qUpper = query.toUpperCase();

      for (const d of snap.divisions) {
        if (!d.matches) continue;
        for (const m of d.matches) {
          if (m.p1) {
            if (m.p1.id.toUpperCase() === qUpper || m.p1.name === query) {
              foundId = m.p1.id;
              foundName = m.p1.name;
              break;
            }
          }
          if (m.p2) {
            if (m.p2.id.toUpperCase() === qUpper || m.p2.name === query) {
              foundId = m.p2.id;
              foundName = m.p2.name;
              break;
            }
          }
        }
        if (foundId) break;
      }

      if (!foundId && snap.checkin && snap.checkin.players) {
        for (const p of snap.checkin.players) {
          if (p.id.toUpperCase() === qUpper || p.name === query) {
            foundId = p.id;
            foundName = p.name;
            break;
          }
        }
      }

      if (!foundId) {
        resultEl.textContent = `查無選手「${query}」的比賽紀錄`;
        return;
      }

      // 尋找選手當前或下一場比賽
      let bestMatch = null;
      for (const d of snap.divisions) {
        if (!d.matches) continue;
        for (const m of d.matches) {
          const isP1 = m.p1 && m.p1.id === foundId;
          const isP2 = m.p2 && m.p2.id === foundId;
          if (!isP1 && !isP2) continue;

          if (m.state === 'open') {
            bestMatch = m;
            break;
          }
          if (m.state === 'pending' && (!bestMatch || bestMatch.state !== 'open')) {
            bestMatch = m;
          }
        }
        if (bestMatch && bestMatch.state === 'open') break;
      }

      if (bestMatch) {
        const isP1 = bestMatch.p1 && bestMatch.p1.id === foundId;
        const opp = isP1 ? bestMatch.p2 : bestMatch.p1;
        const matchLabel = bestMatch.label || '比賽';

        if (bestMatch.state === 'open') {
          if (bestMatch.table !== null) {
            const oppName = opp ? opp.name : '待定';
            resultEl.textContent = `【${matchLabel}】第 ${bestMatch.table} 桌 · 對手 ${oppName}`;
          } else {
            const oppName = opp ? opp.name : '待定';
            resultEl.textContent = `【${matchLabel}】等桌中 · 對手 ${oppName}`;
          }
        } else if (bestMatch.state === 'pending') {
          if (!opp) {
            resultEl.textContent = `【${matchLabel}】等對手中（對手尚未確定）`;
          } else {
            resultEl.textContent = `【${matchLabel}】等對手結束前場 · 對手 ${opp.name}`;
          }
        }
      } else {
        resultEl.textContent = `選手 ${foundName} (${foundId}) 目前無待打場次（已淘汰出局或賽程結束）`;
      }
    }

    // 2. 登入功能
    let elimLoginCountdown = null;
    let isSubmittingElimLogin = false;
    document.getElementById('elimLogin').addEventListener('click', async () => {
      const loginBtn = document.getElementById('elimLogin');
      if (isSubmittingElimLogin || (loginBtn && loginBtn.disabled)) return;
      const pid = document.getElementById('elimId').value.trim();
      const pin = document.getElementById('elimPin').value.trim();
      if (!pid || !pin) {
        showLoginMsg('請輸入選手編號與 PIN 碼');
        return;
      }
      showLoginMsg('');
      isSubmittingElimLogin = true;
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = '登入中…';
      }
      let isLocked = false;
      try {
        await playerAuth.login(pid, pin);
      } catch (err) {
        console.error('淘汰賽選手登入失敗:', err);
        const retrySec = Number(err && (err.retryAfterSec || err.retry_after_sec || (err.data && err.data.retry_after_sec)) || 0);
        if (err && err.status === 423 && retrySec > 0) {
          isLocked = true;
          if (elimLoginCountdown) elimLoginCountdown.stop();
          if (loginBtn) {
            loginBtn.disabled = true;
            loginBtn.textContent = '登入';
          }
          elimLoginCountdown = PlayerAuth.startCountdown(
            retrySec,
            (sec) => {
              showLoginMsg(PlayerAuth.lockText(sec));
            },
            () => {
              if (loginBtn) {
                loginBtn.disabled = false;
                loginBtn.textContent = '登入';
              }
              showLoginMsg('鎖定已結束，請重新嘗試');
            }
          );
          return;
        }
        showLoginMsg((err && err.message) ? err.message : '登入失敗');
      } finally {
        isSubmittingElimLogin = false;
        if (!isLocked && loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = '登入';
        }
      }
    });

    document.getElementById('elimLogout').addEventListener('click', () => {
      playerAuth.logout();
    });

    function showLoginMsg(msg) {
      document.getElementById('elimLoginMsg').textContent = msg;
    }

    function showReportMsg(msg) {
      document.getElementById('elimReportMsg').textContent = msg;
    }

    // 3. 渲染登入後的選手視野
    function renderPlayerView(data) {
      if (!data) return;
      document.getElementById('elimLoginCard').style.display = 'none';
      document.getElementById('elimActiveCard').style.display = 'block';

      // 選手身分列
      const player = data.player;
      document.getElementById('elimPlayerInfo').textContent = `${player.name} (${player.id}) · ${player.div} 區`;

      // 開賽前名單報到卡片 (snapshot.event.status === 'before')
      const isBefore = Boolean(window.elimSnapshot && window.elimSnapshot.event && window.elimSnapshot.event.status === 'before');
      const ckCard = document.getElementById('playerCheckinCard');
      const unbox = document.getElementById('playerCkUncheckedBox');
      const chkbox = document.getElementById('playerCkCheckedBox');
      const nameDisp = document.getElementById('playerCkDisplayName');
      const nameIn = document.getElementById('playerCkName');
      const newNameIn = document.getElementById('playerCkNewName');
      const matchBox = document.getElementById('elimMatchBox');
      const reportPanel = document.getElementById('elimReportPanel');

      if (ckCard) {
        if (isBefore && data.checkin) {
          ckCard.style.display = 'block';
          if (matchBox) matchBox.style.display = 'none';
          if (reportPanel) reportPanel.style.display = 'none';

          if (!data.checkin.checked_in) {
            unbox.style.display = 'block';
            chkbox.style.display = 'none';
            if (nameIn && document.activeElement !== nameIn && !nameIn.value) {
              nameIn.value = data.checkin.display_name || player.name || '';
            }
          } else {
            unbox.style.display = 'none';
            chkbox.style.display = 'block';
            const curDisplayName = data.checkin.display_name || player.name || '';
            if (nameDisp) nameDisp.textContent = curDisplayName;
            if (newNameIn && document.activeElement !== newNameIn && !newNameIn.value) {
              newNameIn.value = curDisplayName;
            }
          }
        } else {
          ckCard.style.display = 'none';
          if (matchBox) matchBox.style.display = 'block';
          if (reportPanel) reportPanel.style.display = 'block';
        }
      }

      // 目前場次
      const match = data.match;
      const matchEl = document.getElementById('elimMatch');
      if (match) {
        const tableText = (match.table !== null) ? `第 ${match.table} 桌` : '等桌中';
        const oppName = match.opponent ? match.opponent.name : '待定';
        matchEl.textContent = `${match.label} · ${tableText} · 對手：${oppName}`;
      } else if (data.place !== null) {
        matchEl.textContent = `完賽名次：第 ${data.place} 名`;
      } else if (data.eliminated) {
        matchEl.textContent = '已淘汰出局';
      } else {
        matchEl.textContent = '目前無進行中場次';
      }

      // 報分控制區
      const report = data.report;
      const winnerSec = document.getElementById('elimWinnerSection');
      const scoreSec = document.getElementById('elimScoreSection');
      const statusEl = document.getElementById('elimReportStatus');

      if (report && report.can_submit) {
        const canWinner = Array.isArray(report.how) && report.how.includes('winner');
        const canScore = Array.isArray(report.how) && report.how.includes('score');

        winnerSec.style.display = canWinner ? 'block' : 'none';
        scoreSec.style.display = canScore ? 'block' : 'none';

        if (canScore) {
          const snap = window.elimSnapshot;
          const reportCfg = (snap && snap.event && snap.event.game && snap.event.game.report) || { kind: 'score', max_score: 6 };
          const curMy = document.getElementById('elimMyScore') ? document.getElementById('elimMyScore').value : (report.mine && report.mine.my_score != null ? report.mine.my_score : (reportCfg.win_score || 4));
          const curOpp = document.getElementById('elimOppScore') ? document.getElementById('elimOppScore').value : (report.mine && report.mine.opp_score != null ? report.mine.opp_score : 0);
          const scoreContainer = document.getElementById('elimScoreWidgetContainer');
          if (scoreContainer && typeof buildReportWidgetHtml === 'function') {
            scoreContainer.innerHTML = buildReportWidgetHtml(reportCfg, 'top_cut', 'elim-player', { myScore: curMy, oppScore: curOpp }, { myId: 'elimMyScore', oppId: 'elimOppScore', myLabel: '你的得分', oppLabel: '對手得分' });
          }
        }

        // 狀態文字顯示
        if (report.state === 'conflict') {
          statusEl.textContent = '雙方回報不一致，請核對後重新送出';
          statusEl.className = 'report-status-box conflict';
        } else if (report.theirs) {
          if (report.theirs.how === 'score') {
            statusEl.textContent = `對手已回報：你 ${report.theirs.my_score}、對手 ${report.theirs.opp_score}，請核對後回報`;
          } else {
            const oppSaid = report.theirs.winner === loggedPlayerId ? '你勝' : '對手勝';
            statusEl.textContent = `對手已回報：${oppSaid}，請核對後回報`;
          }
          statusEl.className = 'report-status-box notice';
        } else if (report.mine) {
          statusEl.textContent = '已送出回報，等對手回報中...';
          statusEl.className = 'report-status-box notice';
        } else {
          statusEl.textContent = '請選擇勝負或送出比分';
          statusEl.className = 'report-status-box';
        }
      } else {
        // 不能報分，隱藏按鈕並說明原因
        winnerSec.style.display = 'none';
        scoreSec.style.display = 'none';

        if (match && match.state === 'complete') {
          statusEl.textContent = '比賽結果已生效！';
          statusEl.className = 'report-status-box success';
        } else if (report && report.why_not) {
          statusEl.textContent = report.why_not;
          statusEl.className = 'report-status-box notice';
        } else {
          statusEl.textContent = '目前未開放選手報分';
          statusEl.className = 'report-status-box';
        }
      }

      // 叫裁判控制區 (DATA-CONTRACT 7.11)
      const isSeated = Boolean(match && match.state === 'open' && match.table !== null);
      CallJudge.update({
        judge_call: data.judge_call,
        canCall: isSeated
      });
    }

    // 4. 報分動作與確認視窗
    document.getElementById('elimIWon').addEventListener('click', () => {
      openConfirmModal({
        action: 'winner',
        i_won: true,
        text: '確定回報「我贏了」？（你勝）'
      });
    });

    document.getElementById('elimILost').addEventListener('click', () => {
      openConfirmModal({
        action: 'winner',
        i_won: false,
        text: '確定回報「我輸了」？（對手勝）'
      });
    });

    document.getElementById('elimScoreSubmit').addEventListener('click', () => {
      const myScore = parseInt(document.getElementById('elimMyScore').value, 10);
      const oppScore = parseInt(document.getElementById('elimOppScore').value, 10);
      const outcome = (myScore > oppScore) ? '你勝' : ((myScore < oppScore) ? '對手勝' : '平手');

      openConfirmModal({
        action: 'score',
        my_score: myScore,
        opp_score: oppScore,
        text: `你 ${myScore}、對手 ${oppScore} → ${outcome}`
      });
    });

    function openConfirmModal(config) {
      pendingReportAction = config;
      document.getElementById('elimConfirmMsg').textContent = config.text;
      document.getElementById('elimConfirmModal').style.display = 'flex';
      showReportMsg('');
    }

    function closeConfirmModal() {
      pendingReportAction = null;
      document.getElementById('elimConfirmModal').style.display = 'none';
    }

    document.getElementById('elimCancel').addEventListener('click', () => {
      closeConfirmModal();
    });

    document.getElementById('elimConfirm').addEventListener('click', async () => {
      if (!pendingReportAction || isSubmitting) return;
      if (!activePlayerData || !activePlayerData.match) return;

      const action = pendingReportAction;
      const matchId = activePlayerData.match.id;
      const submitBtn = document.getElementById('elimConfirm');

      isSubmitting = true;
      submitBtn.disabled = true;

      const payload = {
        player_id: loggedPlayerId,
        pin: loggedPin,
        match: matchId
      };

      if (action.action === 'winner') {
        payload.i_won = action.i_won;
      } else {
        payload.my_score = action.my_score;
        payload.opp_score = action.opp_score;
      }

      try {
        const res = await callApi('/api/player/report', payload);
        closeConfirmModal();
        activePlayerData = res;
        renderPlayerView(res);
        showReportMsg('');
      } catch (err) {
        showReportMsg(err.message || '回報失敗，請確認網路後再試');
        closeConfirmModal();
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
      }
    });

    // 4.1 現場名單報到事件
    let isSubmittingCheckin = false;
    const arriveBtn = document.getElementById('playerCkArrive');
    if (arriveBtn) {
      arriveBtn.addEventListener('click', async () => {
        if (isSubmittingCheckin || !loggedPlayerId || !loggedPin) return;
        const nameIn = document.getElementById('playerCkName');
        const dName = nameIn ? nameIn.value.trim() : '';
        const ckMsg = document.getElementById('playerCkMsg');
        if (ckMsg) { ckMsg.style.display = 'none'; ckMsg.textContent = ''; }
        isSubmittingCheckin = true;
        arriveBtn.disabled = true;
        arriveBtn.textContent = '報到中...';
        try {
          const payload = {
            player_id: loggedPlayerId,
            pin: loggedPin
          };
          if (dName) payload.display_name = dName;
          await callApi('/api/player/checkin', payload);
          if (ckMsg) {
            ckMsg.textContent = '報到成功！';
            ckMsg.className = 'msg-text msg-success';
            ckMsg.style.display = 'block';
          }
          await refreshPlayerMeSilently();
        } catch (err) {
          if (ckMsg) {
            ckMsg.textContent = err.message || '報到失敗，請稍候再試';
            ckMsg.className = 'msg-text msg-danger';
            ckMsg.style.display = 'block';
          }
        } finally {
          isSubmittingCheckin = false;
          arriveBtn.disabled = false;
          arriveBtn.textContent = '我到了';
        }
      });
    }

    const editNameBtn = document.getElementById('playerCkEditNameBtn');
    const editNameForm = document.getElementById('playerCkEditNameForm');
    if (editNameBtn && editNameForm) {
      editNameBtn.addEventListener('click', () => {
        editNameForm.style.display = (editNameForm.style.display === 'none') ? 'block' : 'none';
      });
    }

    const cancelNameBtn = document.getElementById('playerCkCancelNameBtn');
    if (cancelNameBtn && editNameForm) {
      cancelNameBtn.addEventListener('click', () => {
        editNameForm.style.display = 'none';
      });
    }

    const saveNameBtn = document.getElementById('playerCkSaveNameBtn');
    if (saveNameBtn) {
      saveNameBtn.addEventListener('click', async () => {
        if (isSubmittingCheckin || !loggedPlayerId || !loggedPin) return;
        const newNameIn = document.getElementById('playerCkNewName');
        const dName = newNameIn ? newNameIn.value.trim() : '';
        if (!dName) return;
        const ckMsg = document.getElementById('playerCkMsg');
        if (ckMsg) { ckMsg.style.display = 'none'; ckMsg.textContent = ''; }
        isSubmittingCheckin = true;
        saveNameBtn.disabled = true;
        saveNameBtn.textContent = '儲存中...';
        try {
          await callApi('/api/player/checkin', {
            player_id: loggedPlayerId,
            pin: loggedPin,
            display_name: dName
          });
          if (editNameForm) editNameForm.style.display = 'none';
          if (ckMsg) {
            ckMsg.textContent = '名稱已更新！';
            ckMsg.className = 'msg-text msg-success';
            ckMsg.style.display = 'block';
          }
          await refreshPlayerMeSilently();
        } catch (err) {
          if (ckMsg) {
            ckMsg.textContent = err.message || '更新名稱失敗';
            ckMsg.className = 'msg-text msg-danger';
            ckMsg.style.display = 'block';
          }
        } finally {
          isSubmittingCheckin = false;
          saveNameBtn.disabled = false;
          saveNameBtn.textContent = '儲存名稱';
        }
      });
    }

    // 頁面載入時檢查是否有暫存登入資訊
    window.addEventListener('DOMContentLoaded', () => {
      CallJudge.mount({
        ids: {
          card: 'elimCallSection',
          btn: 'elimCallBtn',
          form: 'elimCallForm',
          note: 'elimCallNote',
          submit: 'elimCallSubmit',
          cancel: 'elimCallCancel',
          status: 'elimCallStatus',
          error: 'elimCallError'
        },
        getAuth: () => {
          return playerAuth.get();
        },
        extraPayload: () => {
          const matchId = (activePlayerData && activePlayerData.match) ? activePlayerData.match.id : null;
          return { match: matchId };
        },
        post: async (path, body) => {
          return await callApi(path, body);
        },
        afterChange: (res) => {
          if (res) {
            activePlayerData = res;
            playerAuth.setMe(res);
            renderPlayerView(res);
          } else if (playerAuth.get()) {
            refreshPlayerMeSilently();
          }
        },
        now: () => ((typeof poller !== 'undefined' && poller.now) ? poller.now() : Date.now())
      });

      poller.fetchOnce();
      poller.start();

      playerAuth.restore();
    });
  </script>
  <script src="report-widget.js"></script>
</body>
</html>
