<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>符文戰場 — 淘汰賽裁判端</title>
  <style>
    :root {
      --bg: #01222F;
      --card-bg: #013951;
      --card-border: #0A5570;
      --text-primary: #F9F9F9;
      --text-secondary: #9FB8C4;
      --accent: #EF7D00;
      --accent-hover: #C86800;
      --accent-text: #FF941E;
      --warning-bg: #3E3312;
      --warning-border: #8A6D1F;
      --warning-text: #F2C94C;
      --danger-bg: #4A1F1C;
      --danger-border: #A8443C;
      --danger-text: #ED807A;
      --success-bg: #0A3F33;
      --success-border: #1F7A55;
      --success-text: #2FB574;
      --chip-bg: #0A4A63;
      --input-bg: #011A24;
      --info-bg: #1B2F4A;
      --info-border: #2F5A80;
      --info-text: #4FA8D8;
      --judge-bg: #2E2140;
      --judge-border: #553C77;
      --judge-text: #B38FE0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      -webkit-text-size-adjust: 100%;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: Inter, system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      width: 100%;
    }

    input, select, textarea {
      font-size: 1rem;
      color: var(--text-primary);
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      min-height: 44px;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 14px 40px;
      overflow-x: hidden;
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px 10px 30px;
      }
    }

    /* 頂部導覽列 */
    header {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .page-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .judge-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 700;
      background: var(--judge-bg);
      border: 1px solid var(--judge-border);
      color: var(--judge-text);
    }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
    }

    /* 卡片共通 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      overflow-x: hidden;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-text);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
      background: var(--chip-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
    }

    .badge.live {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    /* 按鈕 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--chip-bg);
      border-color: var(--card-border);
      color: var(--text-primary);
    }

    .btn-danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .btn-warning {
      background: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--warning-text);
    }

    .btn-success {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .btn-block {
      width: 100%;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 訊息提示框 */
    .msg-box {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .msg-box.error {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

    .msg-box.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .msg-box.warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
    }

    /* 衝突清單項目 */
    .conflict-item {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 44px;
      width: 100%;
      text-align: left;
    }

    .conflict-item:hover {
      background: rgba(62, 51, 18, 0.6);
    }

    /* 桌次按鈕清單 */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .ej-table {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 0.85rem;
      width: 100%;
    }

    .ej-table:hover {
      border-color: var(--accent);
    }

    /* 逐分計分按鈕區 */
    .point-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .point-col-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-text);
      margin-bottom: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ej-point {
      width: 100%;
      padding: 8px 6px;
      font-size: 0.85rem;
      margin-bottom: 6px;
      text-align: center;
      min-height: 44px;
      min-width: 44px;
    }

    /* 確認彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent-text);
    }

    .modal-msg {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 16px;
      color: var(--text-primary);
      word-break: break-word;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* 選手協助按鈕尺寸與字級保證 (review.py [46]) */
    #ejUnlock, #ejPinReset, #ejNewPinDone, #ejLogout, #ejRefreshConflicts {
      min-height: 44px;
      min-width: 44px;
      box-sizing: border-box;
    }

    #ejPlayerId {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h1 class="page-title">淘汰賽裁判工作台</h1>
          <span class="judge-badge">裁判端</span>
        </div>
        <div id="ejUserBar" class="user-bar" style="display: none;">
          <span>裁判：<strong id="ejStaffName"></strong></span>
          <button type="button" id="ejLogout" class="btn btn-secondary" style="min-height: 44px; min-width: 44px; padding: 4px 10px; font-size: 0.85rem;">登出</button>
        </div>
      </div>
    </header>

    <!-- 登入區塊 -->
    <section id="ejLoginSection" class="card">
      <h2 class="card-title">工作人員登入</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 12px;">
        請輸入裁判或主辦 PIN 碼以開始現場裁判作業。
      </p>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;">
        <label for="ejPin" style="font-size: 0.88rem; font-weight: 600;">工作人員 PIN 碼</label>
        <div style="display: flex; gap: 8px;">
          <input type="password" id="ejPin" placeholder="例如 judge-demo" autocomplete="off">
          <button type="button" id="ejLogin" class="btn btn-primary" style="min-width: 80px;">登入</button>
        </div>
      </div>
      <div id="ejLoginMsg" class="msg-box error" style="display: none;"></div>
    </section>

    <!-- 主要作業區塊（登入後顯示） -->
    <main id="ejMainSection" style="display: none;">
      <!-- 操作回饋與主機退回訊息區 -->
      <div id="ejMsg" class="msg-box error" style="display: none;"></div>

      <!-- 選手協助區塊 (PROJECT.md 第四十二輪, review.py [46]) -->
      <section class="card" id="ejPlayerAssistSection">
        <h2 class="card-title">選手協助（解鎖／重設 PIN）</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px;">
          若選手輸錯多次 PIN 遭鎖定或遺失 PIN 碼，可在此進行解鎖或重設。
        </p>
        <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;">
          <label for="ejPlayerId" style="font-size: 0.88rem; font-weight: 600;">選手編號：</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input type="text" id="ejPlayerId" placeholder="例如 A-03" autocomplete="off" autocapitalize="characters" style="flex: 1 1 120px; min-width: 0; font-size: 16px;">
            <button type="button" id="ejUnlock" class="btn btn-secondary" style="white-space: nowrap; min-height: 44px; min-width: 44px;">解鎖</button>
            <button type="button" id="ejPinReset" class="btn btn-warning" style="white-space: nowrap; min-height: 44px; min-width: 44px;">重設 PIN</button>
          </div>
        </div>

        <!-- 重設成功大字顯示新 PIN 碼（按已抄下後清空且不存入任何地方） -->
        <div id="ejNewPinBox" class="msg-box" style="display: none; background: rgba(30, 41, 59, 0.8); border: 2px solid var(--accent); padding: 14px; text-align: center; margin-bottom: 10px;">
          <div style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 4px;">重設成功！新 PIN 碼（請選手抄下）：</div>
          <div id="ejNewPin" style="font-size: 2.2rem; font-weight: 800; letter-spacing: 4px; color: var(--accent); font-family: monospace; margin: 8px 0; word-break: break-all;"></div>
          <button type="button" id="ejNewPinDone" class="btn btn-primary" style="margin-top: 6px; padding: 6px 20px; min-height: 44px; min-width: 44px;">已抄下</button>
        </div>

        <div id="ejPlayerAssistMsg" class="msg-box" style="display: none;"></div>
      </section>

      <!-- 爭議衝突清單區塊 -->
      <section class="card">
        <div class="card-title">
          <span>⚠️ 爭議衝突清單</span>
          <button type="button" id="ejRefreshConflicts" class="btn btn-secondary" style="min-height: 44px; min-width: 44px; padding: 4px 8px; font-size: 0.78rem;">重新整理</button>
        </div>
        <p style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 8px;">
          雙方選手回報結果不一致的場次，點擊即可載入並裁定。
        </p>
        <div id="ejConflicts">
          <div style="font-size: 0.88rem; color: var(--text-secondary); padding: 6px 0;">載入衝突場次中...</div>
        </div>
      </section>

      <!-- 選擇桌次 / 輸入場次區塊 -->
      <section class="card">
        <h2 class="card-title">桌次與場次檢視</h2>
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
          <label for="ejDiv" style="font-size: 0.88rem; font-weight: 700; white-space: nowrap;">選區：</label>
          <select id="ejDiv">
            <option value="A">A 區</option>
            <option value="B">B 區</option>
          </select>
        </div>

        <div id="ejTables" class="tables-grid">
          <div style="font-size: 0.85rem; color: var(--text-secondary); grid-column: 1 / -1;">正在讀取桌況...</div>
        </div>

        <div style="margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--card-border);">
          <label for="ejMatchId" style="font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; display: block;">直接輸入場次編號：</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="ejMatchId" placeholder="例如 A-R0-M00">
            <button type="button" id="ejLoad" class="btn btn-primary" style="white-space: nowrap;">載入場次</button>
          </div>
        </div>
      </section>

      <!-- 場次詳情卡片（嚴格禁止出現任何 p1 或 p2 字樣） -->
      <section class="card" id="ejDetail">
        <div style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 12px 0;">
          請從上方點選衝突場次、桌次，或輸入場次編號以檢視詳情。
        </div>
      </section>

      <!-- 裁判回報／判定作業面板 -->
      <section class="card" id="ejActionPanel" style="display: none;">
        <h2 class="card-title">裁判判定與送出結果</h2>

        <!-- 方式 1: 只按誰贏 -->
        <div id="ejWinnerGroup" style="display: none; margin-bottom: 16px;">
          <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; color: var(--accent-text);">
            只按誰贏（直接裁定勝方）：
          </div>
          <div id="ejWinnerButtons" class="btn-row"></div>
        </div>

        <!-- 方式 2: 比分回報 -->
        <div id="ejScoreGroup" style="display: none; margin-bottom: 16px;">
          <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; color: var(--accent-text);">
            最後比分：
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
            <div>
              <label id="ejP1ScoreLabel" for="ejP1Score" style="font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; display: block;"></label>
              <select id="ejP1Score">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
              </select>
            </div>
            <div>
              <label id="ejP2ScoreLabel" for="ejP2Score" style="font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; display: block;"></label>
              <select id="ejP2Score">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
              </select>
            </div>
          </div>
          <button type="button" id="ejScoreSubmit" class="btn btn-primary btn-block">送出比分</button>
        </div>

        <!-- 方式 3: 逐分計分 -->
        <div id="ejPointsGroup" style="display: none; margin-bottom: 16px;">
          <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; color: var(--accent-text);">
            逐分計分（戰鬥陀螺 X 記分）：
          </div>
          <div class="point-grid">
            <div>
              <div id="ejP1PointColTitle" class="point-col-title"></div>
              <button type="button" class="btn btn-secondary ej-point" data-side="p1" data-type="xtreme">極限 (+3)</button>
              <button type="button" class="btn btn-secondary ej-point" data-side="p1" data-type="over">擊飛 (+2)</button>
              <button type="button" class="btn btn-secondary ej-point" data-side="p1" data-type="burst">爆裂 (+2)</button>
              <button type="button" class="btn btn-secondary ej-point" data-side="p1" data-type="spin">迴轉 (+1)</button>
            </div>
            <div>
              <div id="ejP2PointColTitle" class="point-col-title"></div>
              <button type="button" class="btn btn-secondary ej-point" data-side="p2" data-type="xtreme">極限 (+3)</button>
              <button type="button" class="btn btn-secondary ej-point" data-side="p2" data-type="over">擊飛 (+2)</button>
              <button type="button" class="btn btn-secondary ej-point" data-side="p2" data-type="burst">爆裂 (+2)</button>
              <button type="button" class="btn btn-secondary ej-point" data-side="p2" data-type="spin">迴轉 (+1)</button>
            </div>
          </div>

          <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button type="button" id="ejPointUndo" class="btn btn-warning" style="flex: 1;">復原最後一分</button>
            <button type="button" id="ejPointsSubmit" class="btn btn-primary" style="flex: 1;">送出逐分結果</button>
          </div>

          <div style="font-size: 0.88rem; font-weight: 700; margin-bottom: 4px;">目前得分紀錄：</div>
          <div id="ejPointList" style="background: rgba(0, 0, 0, 0.25); border: 1px solid var(--card-border); border-radius: 6px; padding: 10px; min-height: 48px;">
            <div style="color: var(--text-secondary); font-size: 0.85rem;">尚未記錄得分</div>
          </div>
        </div>

        <!-- 撤銷功能 -->
        <div id="ejVoidContainer" style="display: none; padding-top: 10px; border-top: 1px dashed var(--card-border);">
          <button type="button" id="ejVoid" class="btn btn-danger btn-block">撤銷此場比賽結果（回退至可打）</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 操作確認彈窗（包含 confirmYes 與 confirmNo） -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div id="confirmTitle" class="modal-title">操作確認</div>
      <div id="confirmMessage" class="modal-msg"></div>
      <div class="modal-btns">
        <button type="button" id="confirmNo" class="btn btn-secondary">取消</button>
        <button type="button" id="confirmYes" class="btn btn-danger">確認送出</button>
      </div>
    </div>
  </div>

  <script src="elim-common.js"></script>
  <script>
    // 嚴格遵守：PIN 僅存放在記憶體或 sessionStorage，絕不存進 localStorage
    const SESSION_KEY_PIN = 'riftbound_elim_judge_pin';
    let staffPin = '';
    let staffRole = '';
    let staffName = '';

    let currentMatch = null;
    let currentPoints = [];
    let pendingConfirmAction = null;
    let poller = null;
    let conflictTimer = null;

    // 確認彈窗輔助函式
    function showConfirm(title, message, onConfirmed) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmModal').style.display = 'flex';
      pendingConfirmAction = onConfirmed;
    }

    document.getElementById('confirmYes').addEventListener('click', async () => {
      document.getElementById('confirmModal').style.display = 'none';
      if (pendingConfirmAction) {
        const action = pendingConfirmAction;
        pendingConfirmAction = null;
        await action();
      }
    });

    document.getElementById('confirmNo').addEventListener('click', () => {
      document.getElementById('confirmModal').style.display = 'none';
      pendingConfirmAction = null;
    });

    // 登入邏輯
    async function doLogin(pin) {
      const loginBtn = document.getElementById('ejLogin');
      const loginMsg = document.getElementById('ejLoginMsg');
      loginBtn.disabled = true;
      loginMsg.style.display = 'none';

      try {
        const res = await callApi('/api/staff/whoami', { staff_pin: pin });
        staffPin = pin;
        staffRole = res.role || 'judge';
        staffName = res.name || '示範裁判';
        sessionStorage.setItem(SESSION_KEY_PIN, pin);

        document.getElementById('ejStaffName').textContent = staffName;
        document.getElementById('ejUserBar').style.display = 'flex';
        document.getElementById('ejLoginSection').style.display = 'none';
        document.getElementById('ejMainSection').style.display = 'block';

        // 登入成功後開始輪詢與載入資料
        if (!poller) {
          poller = new ElimPoller({
            onData: (data) => {
              onSnapshotUpdate(data);
            },
            interval: 5000
          });
          poller.start();
        }
        await poller.fetchOnce();
        await loadConflicts();
        startConflictPolling();
      } catch (err) {
        loginMsg.textContent = err.message || '登入失敗，請確認 PIN 碼';
        loginMsg.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
      }
    }

    document.getElementById('ejLogin').addEventListener('click', () => {
      const pin = (document.getElementById('ejPin').value || '').trim();
      if (!pin) {
        const msg = document.getElementById('ejLoginMsg');
        msg.textContent = '請輸入工作人員 PIN 碼';
        msg.style.display = 'block';
        return;
      }
      doLogin(pin);
    });

    document.getElementById('ejLogout').addEventListener('click', () => {
      staffPin = '';
      staffRole = '';
      staffName = '';
      sessionStorage.removeItem(SESSION_KEY_PIN);
      if (conflictTimer) clearInterval(conflictTimer);
      if (poller) poller.stop();

      document.getElementById('ejUserBar').style.display = 'none';
      document.getElementById('ejMainSection').style.display = 'none';
      document.getElementById('ejLoginSection').style.display = 'block';
      document.getElementById('ejPin').value = '';
      document.getElementById('ejDetail').innerHTML = '<div style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 12px 0;">請從上方點選衝突場次、桌次，或輸入場次編號以檢視詳情。</div>';
      document.getElementById('ejActionPanel').style.display = 'none';

      const pidInput = document.getElementById('ejPlayerId');
      if (pidInput) pidInput.value = '';
      handleNewPinDone();
      const paMsg = document.getElementById('ejPlayerAssistMsg');
      if (paMsg) {
        paMsg.textContent = '';
        paMsg.style.display = 'none';
      }
    });

    // 衝突場次載入與輪詢
    async function loadConflicts() {
      if (!staffPin) return;
      try {
        const res = await callApi('/api/staff/conflicts', { staff_pin: staffPin });
        const matches = res.matches || [];
        const container = document.getElementById('ejConflicts');
        if (!matches.length) {
          container.innerHTML = '<div style="font-size: 0.88rem; color: var(--text-secondary); padding: 4px 0;">目前沒有爭議場次</div>';
          return;
        }

        let html = '';
        for (const m of matches) {
          const p1Name = (m.p1 && m.p1.name) ? m.p1.name : '（待定）';
          const p2Name = (m.p2 && m.p2.name) ? m.p2.name : '（待定）';
          const tbl = m.table ? `第 ${m.table} 桌` : '等桌中';
          html += `
            <div class="conflict-item ej-conflict" data-match="${escapeHtml(m.id)}">
              <div>
                <span style="font-weight: 700;">${escapeHtml(m.label || m.id)}</span>
                <span style="font-size: 0.8rem; margin-left: 6px; color: var(--warning-text);">[${tbl}]</span>
                <div style="font-size: 0.85rem; color: var(--text-primary); margin-top: 2px;">
                  ${escapeHtml(p1Name)} VS ${escapeHtml(p2Name)}
                </div>
              </div>
              <span class="badge" style="background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text);">衝突</span>
            </div>
          `;
        }
        container.innerHTML = html;

        // 綁定點擊事件
        const items = container.querySelectorAll('.ej-conflict');
        items.forEach(item => {
          item.addEventListener('click', () => {
            const mid = item.getAttribute('data-match');
            if (mid) {
              document.getElementById('ejMatchId').value = mid;
              loadMatch(mid);
            }
          });
        });
      } catch (err) {
        // 衝突更新錯誤默默吞下或顯示
      }
    }

    function startConflictPolling() {
      if (conflictTimer) clearInterval(conflictTimer);
      conflictTimer = setInterval(() => {
        if (document.visibilityState !== 'hidden') {
          loadConflicts();
        }
      }, 15000);
    }

    document.getElementById('ejRefreshConflicts').addEventListener('click', loadConflicts);

    // Snapshot 資料更新回呼
    function onSnapshotUpdate(snap) {
      if (!snap) return;
      updateDivSelect(snap.divisions || []);
      renderTables();
    }

    function updateDivSelect(divs) {
      const select = document.getElementById('ejDiv');
      const cur = select.value;
      if (!divs.length) return;
      const opts = divs.map(d => `<option value="${escapeHtml(d.div)}">${escapeHtml(d.div)} 區</option>`).join('');
      if (select.innerHTML !== opts) {
        select.innerHTML = opts;
        if (divs.some(d => d.div === cur)) {
          select.value = cur;
        }
      }
    }

    document.getElementById('ejDiv').addEventListener('change', () => {
      renderTables();
    });

    // 渲染桌次按鈕
    function renderTables() {
      const snap = window.elimSnapshot;
      if (!snap || !snap.divisions) return;
      const currentDiv = document.getElementById('ejDiv').value;
      const divData = snap.divisions.find(d => d.div === currentDiv);
      const container = document.getElementById('ejTables');

      if (!divData || !divData.tables || !divData.tables.length) {
        container.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-secondary); grid-column: 1 / -1;">此區尚未配置桌次</div>';
        return;
      }

      let html = '';
      for (const t of divData.tables) {
        if (t.match) {
          const matchObj = (divData.matches || []).find(m => m.id === t.match);
          const p1Name = (matchObj && matchObj.p1 && matchObj.p1.name) ? matchObj.p1.name : '';
          const p2Name = (matchObj && matchObj.p2 && matchObj.p2.name) ? matchObj.p2.name : '';
          const vsText = (p1Name && p2Name) ? `${p1Name} v ${p2Name}` : '';
          html += `
            <button type="button" class="ej-table" data-match="${escapeHtml(t.match)}">
              <span style="font-weight: 700; color: var(--accent-text);">第 ${t.table} 桌</span>
              <span style="font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(vsText || t.match)}</span>
            </button>
          `;
        } else {
          const stateLabel = t.hold ? '暫停使用' : '空桌';
          html += `
            <div style="background: rgba(0,0,0,0.15); border: 1px dashed var(--card-border); border-radius: 6px; padding: 8px 10px; min-height: 52px; display: flex; flex-direction: column; justify-content: center; font-size: 0.85rem;">
              <span style="color: var(--text-secondary);">第 ${t.table} 桌</span>
              <span style="font-size: 0.78rem; color: ${t.hold ? 'var(--warning-text)' : 'var(--text-secondary)'};">${stateLabel}</span>
            </div>
          `;
        }
      }
      container.innerHTML = html;

      // 綁定桌次點擊事件
      const tableBtns = container.querySelectorAll('.ej-table');
      tableBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const mid = btn.getAttribute('data-match');
          if (mid) {
            document.getElementById('ejMatchId').value = mid;
            loadMatch(mid);
          }
        });
      });
    }

    // 載入場次資料
    async function loadMatch(mid) {
      if (!staffPin || !mid) return;
      const loadBtn = document.getElementById('ejLoad');
      loadBtn.disabled = true;
      const msgEl = document.getElementById('ejMsg');
      msgEl.textContent = '';
      msgEl.style.display = 'none';

      try {
        const res = await callApi('/api/staff/match', { staff_pin: staffPin, match: mid });
        currentMatch = res.match;
        currentPoints = [];
        renderPointList();

        renderMatchDetail(currentMatch);
        renderActionPanel(currentMatch);
      } catch (err) {
        msgEl.textContent = err.message || '載入場次失敗';
        msgEl.style.display = 'block';
      } finally {
        loadBtn.disabled = false;
      }
    }

    document.getElementById('ejLoad').addEventListener('click', () => {
      const mid = (document.getElementById('ejMatchId').value || '').trim();
      if (mid) {
        loadMatch(mid);
      }
    });

    // 渲染場次詳情（嚴格確保 innerText 內絕對不可出現 "p1" 或 "p2"）
    function renderMatchDetail(m) {
      const detailEl = document.getElementById('ejDetail');
      if (!m) {
        detailEl.innerHTML = '<div style="color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 12px 0;">請選擇場次</div>';
        return;
      }

      const p1Name = (m.p1 && m.p1.name) ? m.p1.name : '（待定）';
      const p2Name = (m.p2 && m.p2.name) ? m.p2.name : '（待定）';
      const p1Seed = (m.p1 && m.p1.seed != null) ? `(${m.p1.seed})` : '';
      const p2Seed = (m.p2 && m.p2.seed != null) ? `(${m.p2.seed})` : '';

      // 報分設定文字（規格驗收特別檢查：包含「逐分」與「桌」等字眼）
      const pol = m.policy || {};
      const howList = pol.how || [];
      const howMap = { winner: '只按誰贏', score: '最後比分', points: '逐分計分' };
      const fromMap = { all: '全場', div: '區', table: '桌' };
      const howNames = howList.map(h => howMap[h] || h).join('、') || '無';
      const fromName = fromMap[pol.how_from] || pol.how_from || '全場';
      const policyText = `報分設定：${howNames}（來自${fromName}）`;

      // 雙方回報狀況（使用雙方名字，絕無任何 p1、p2）
      let reportsHtml = '';
      if (m.reports) {
        const r1 = m.reports.p1;
        const r2 = m.reports.p2;

        function getReportDesc(pName, r) {
          if (!r) return `${pName}：尚未回報`;
          if (r.how === 'winner') {
            const winName = (m.p1 && r.winner === m.p1.id) ? p1Name : (m.p2 && r.winner === m.p2.id) ? p2Name : '勝方';
            return `${pName}：回報 ${winName} 勝`;
          }
          if (r.how === 'score') {
            return `${pName}：回報比分 ${r.p1} 比 ${r.p2}`;
          }
          return `${pName}：已送出回報`;
        }

        reportsHtml = `
          <div style="margin-top: 10px; padding: 10px; background: rgba(0, 0, 0, 0.25); border-radius: 6px; border: 1px solid var(--card-border);">
            <div style="font-weight: 700; margin-bottom: 4px; color: var(--accent-text);">選手各自回報：</div>
            <div style="font-size: 0.92rem; margin-bottom: 3px;">${escapeHtml(getReportDesc(p1Name, r1))}</div>
            <div style="font-size: 0.92rem;">${escapeHtml(getReportDesc(p2Name, r2))}</div>
          </div>
        `;
      }

      // 桌次與狀態
      const tableText = m.table ? `第 ${m.table} 桌` : '等桌中';
      let stateBadge = `<span class="badge ${m.state === 'open' ? 'live' : ''}">${tableText}</span>`;
      if (m.state === 'complete') {
        const winnerName = (m.p1 && m.winner === m.p1.id) ? p1Name : (m.p2 && m.winner === m.p2.id) ? p2Name : '';
        stateBadge = `<span class="badge" style="background: var(--success-bg); border-color: var(--success-border); color: var(--success-text);">已完成（勝者：${escapeHtml(winnerName)}）</span>`;
      }

      detailEl.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;">
          <span style="font-weight: 800; font-size: 1.15rem; color: var(--accent-text);">${escapeHtml(m.label || m.id)}</span>
          ${stateBadge}
        </div>
        <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 6px;">
          ${escapeHtml(p1Name)} ${escapeHtml(p1Seed)} <span style="color: var(--text-secondary); font-size: 0.9rem;">VS</span> ${escapeHtml(p2Name)} ${escapeHtml(p2Seed)}
        </div>
        <div style="font-size: 0.9rem; color: var(--warning-text); margin-bottom: 4px;">
          ${escapeHtml(policyText)}
        </div>
        ${reportsHtml}
      `;
    }

    // 渲染判定與送出面板
    function renderActionPanel(m) {
      const panel = document.getElementById('ejActionPanel');
      if (!m) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';

      const pol = m.policy || {};
      const how = pol.how || [];
      const isAdmin = (staffRole === 'admin');

      const canWinner = isAdmin || how.includes('winner');
      const canScore = isAdmin || how.includes('score');
      const canPoints = isAdmin || how.includes('points');

      const isComplete = (m.state === 'complete');
      const isOpen = (m.state === 'open');

      // 撤銷按鈕
      const voidContainer = document.getElementById('ejVoidContainer');
      const voidBtn = document.getElementById('ejVoid');
      if (m.can_void) {
        voidContainer.style.display = 'block';
        voidBtn.style.display = 'block';
      } else {
        voidContainer.style.display = 'none';
        voidBtn.style.display = 'none';
      }

      // 如果比賽已經結束，隱藏報分判定控制項
      if (isComplete) {
        document.getElementById('ejWinnerGroup').style.display = 'none';
        document.getElementById('ejScoreGroup').style.display = 'none';
        document.getElementById('ejPointsGroup').style.display = 'none';
        return;
      }

      // 1. 只按誰贏
      const winnerGroup = document.getElementById('ejWinnerGroup');
      const winnerButtons = document.getElementById('ejWinnerButtons');
      if (isOpen && canWinner && m.p1 && m.p2) {
        winnerGroup.style.display = 'block';
        winnerButtons.innerHTML = `
          <button type="button" class="btn btn-primary ej-winner" data-player="${escapeHtml(m.p1.id)}" style="flex: 1;">
            判定 ${escapeHtml(m.p1.name)} 勝
          </button>
          <button type="button" class="btn btn-primary ej-winner" data-player="${escapeHtml(m.p2.id)}" style="flex: 1;">
            判定 ${escapeHtml(m.p2.name)} 勝
          </button>
        `;

        winnerButtons.querySelectorAll('.ej-winner').forEach(btn => {
          btn.addEventListener('click', () => {
            const pid = btn.getAttribute('data-player');
            const winnerName = (m.p1.id === pid) ? m.p1.name : m.p2.name;
            showConfirm('確認判定勝負', `確定判定【${winnerName}】獲勝嗎？`, () => {
              submitWinner(pid);
            });
          });
        });
      } else {
        winnerGroup.style.display = 'none';
        winnerButtons.innerHTML = '';
      }

      // 2. 比分
      const scoreGroup = document.getElementById('ejScoreGroup');
      if (isOpen && canScore && m.p1 && m.p2) {
        scoreGroup.style.display = 'block';
        document.getElementById('ejP1ScoreLabel').textContent = `${m.p1.name} 分數：`;
        document.getElementById('ejP2ScoreLabel').textContent = `${m.p2.name} 分數：`;
      } else {
        scoreGroup.style.display = 'none';
      }

      // 3. 逐分
      const pointsGroup = document.getElementById('ejPointsGroup');
      if (isOpen && canPoints && m.p1 && m.p2) {
        pointsGroup.style.display = 'block';
        document.getElementById('ejP1PointColTitle').textContent = m.p1.name;
        document.getElementById('ejP2PointColTitle').textContent = m.p2.name;
      } else {
        pointsGroup.style.display = 'none';
      }
    }

    // 只按誰贏送出
    async function submitWinner(pid) {
      if (!currentMatch || !staffPin) return;
      const msgEl = document.getElementById('ejMsg');
      msgEl.textContent = '';
      msgEl.style.display = 'none';

      try {
        await callApi('/api/staff/result', {
          staff_pin: staffPin,
          match: currentMatch.id,
          winner: pid
        });
        await loadMatch(currentMatch.id);
        await loadConflicts();
        renderTables();
      } catch (err) {
        msgEl.textContent = err.message || '送出判定失敗';
        msgEl.style.display = 'block';
      }
    }

    // 比分送出
    document.getElementById('ejScoreSubmit').addEventListener('click', () => {
      if (!currentMatch) return;
      const s1 = parseInt(document.getElementById('ejP1Score').value, 10);
      const s2 = parseInt(document.getElementById('ejP2Score').value, 10);
      const p1Name = currentMatch.p1 ? currentMatch.p1.name : '選手1';
      const p2Name = currentMatch.p2 ? currentMatch.p2.name : '選手2';

      showConfirm('確認送出比分', `確定送出比分：${p1Name} ${s1} - ${s2} ${p2Name} 嗎？`, async () => {
        const msgEl = document.getElementById('ejMsg');
        msgEl.textContent = '';
        msgEl.style.display = 'none';

        try {
          await callApi('/api/staff/result', {
            staff_pin: staffPin,
            match: currentMatch.id,
            p1_score: s1,
            p2_score: s2
          });
          await loadMatch(currentMatch.id);
          await loadConflicts();
          renderTables();
        } catch (err) {
          msgEl.textContent = err.message || '送出比分失敗';
          msgEl.style.display = 'block';
        }
      });
    });

    // 逐分按鈕監聽
    document.querySelectorAll('.ej-point').forEach(btn => {
      btn.addEventListener('click', () => {
        const side = btn.getAttribute('data-side');
        const type = btn.getAttribute('data-type');
        currentPoints.push({ side, type });
        renderPointList();
      });
    });

    document.getElementById('ejPointUndo').addEventListener('click', () => {
      if (currentPoints.length > 0) {
        currentPoints.pop();
        renderPointList();
      }
    });

    function renderPointList() {
      const container = document.getElementById('ejPointList');
      if (!currentPoints.length) {
        container.innerHTML = '<div style="color: var(--text-secondary); font-size: 0.85rem;">尚未記錄得分</div>';
        return;
      }

      const typeLabels = {
        xtreme: '極限 (3分)',
        over: '擊飛 (2分)',
        burst: '爆裂 (2分)',
        spin: '迴轉 (1分)'
      };

      let html = '<ol style="padding-left: 20px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 4px;">';
      for (let i = 0; i < currentPoints.length; i++) {
        const pt = currentPoints[i];
        const pName = (pt.side === 'p1')
          ? (currentMatch && currentMatch.p1 ? currentMatch.p1.name : '選手1')
          : (currentMatch && currentMatch.p2 ? currentMatch.p2.name : '選手2');
        const tName = typeLabels[pt.type] || pt.type;
        html += `<li>${escapeHtml(pName)}：${escapeHtml(tName)}</li>`;
      }
      html += '</ol>';
      container.innerHTML = html;
    }

    document.getElementById('ejPointsSubmit').addEventListener('click', () => {
      if (!currentMatch) return;
      showConfirm('確認送出逐分結果', `確定要送出此場逐分結果嗎？（共記了 ${currentPoints.length} 分）`, async () => {
        const msgEl = document.getElementById('ejMsg');
        msgEl.textContent = '';
        msgEl.style.display = 'none';

        try {
          await callApi('/api/staff/result', {
            staff_pin: staffPin,
            match: currentMatch.id,
            points: currentPoints
          });
          currentPoints = [];
          renderPointList();
          await loadMatch(currentMatch.id);
          await loadConflicts();
          renderTables();
        } catch (err) {
          msgEl.textContent = err.message || '送出逐分計分失敗';
          msgEl.style.display = 'block';
        }
      });
    });

    // 撤銷按鈕
    document.getElementById('ejVoid').addEventListener('click', () => {
      if (!currentMatch) return;
      showConfirm('確認撤銷比賽', '確定要撤銷此場比賽的結果，回到可對戰狀態嗎？', async () => {
        const msgEl = document.getElementById('ejMsg');
        msgEl.textContent = '';
        msgEl.style.display = 'none';

        try {
          await callApi('/api/staff/void', {
            staff_pin: staffPin,
            match: currentMatch.id
          });
          await loadMatch(currentMatch.id);
          await loadConflicts();
          renderTables();
        } catch (err) {
          msgEl.textContent = err.message || '撤銷失敗';
          msgEl.style.display = 'block';
        }
      });
    });

    // ================================================================
    // 選手 PIN 協助與解鎖 (PROJECT.md 第四十二輪, review.py [46])
    // ================================================================

    // 從快照尋找選手姓名 (review.py [46])
    function findPlayerName(pid) {
      if (!pid) return '';
      const target = String(pid).trim().toUpperCase();
      const snap = window.elimSnapshot;
      if (!snap) return target;

      function matchId(id) {
        if (!id) return false;
        const s = String(id).trim().toUpperCase();
        if (s === target) return true;
        const m1 = s.match(/^([A-Z]+)[-_]?0*(\d+)$/);
        const m2 = target.match(/^([A-Z]+)[-_]?0*(\d+)$/);
        if (m1 && m2 && m1[1] === m2[1] && parseInt(m1[2], 10) === parseInt(m2[2], 10)) {
          return true;
        }
        return false;
      }

      // 1. 各分區對戰與名次
      if (Array.isArray(snap.divisions)) {
        for (const div of snap.divisions) {
          if (Array.isArray(div.matches)) {
            for (const m of div.matches) {
              if (m) {
                if (m.p1 && matchId(m.p1.id) && m.p1.name) return m.p1.name;
                if (m.p2 && matchId(m.p2.id) && m.p2.name) return m.p2.name;
              }
            }
          }
          if (Array.isArray(div.placements)) {
            for (const pl of div.placements) {
              if (pl && matchId(pl.id) && pl.name) return pl.name;
            }
          }
          if (Array.isArray(div.winners)) {
            for (const w of div.winners) {
              if (w && matchId(w.id) && w.name) return w.name;
            }
          }
          if (Array.isArray(div.losers)) {
            for (const l of div.losers) {
              if (l && matchId(l.id) && l.name) return l.name;
            }
          }
        }
      }

      // 2. 決賽池與小組成員
      if (snap.finals) {
        if (snap.finals.pools) {
          for (const poolKey of ['winners', 'losers']) {
            const pool = snap.finals.pools[poolKey];
            if (Array.isArray(pool)) {
              for (const p of pool) {
                if (p && matchId(p.id) && p.name) return p.name;
              }
            }
          }
        }
        if (snap.finals.groups) {
          for (const g of Object.values(snap.finals.groups)) {
            if (g && Array.isArray(g.members)) {
              for (const p of g.members) {
                if (p && matchId(p.id) && p.name) return p.name;
              }
            }
            if (g && Array.isArray(g.standings)) {
              for (const p of g.standings) {
                if (p && matchId(p.id) && p.name) return p.name;
              }
            }
          }
        }
        if (Array.isArray(snap.finals.placements)) {
          for (const pl of snap.finals.placements) {
            if (pl && matchId(pl.id) && pl.name) return pl.name;
          }
        }
      }

      // 3. 報到名單
      if (snap.checkin && Array.isArray(snap.checkin.players)) {
        for (const p of snap.checkin.players) {
          if (p && matchId(p.id) && p.name) return p.name;
        }
      }

      return target;
    }

    // 解鎖選手 (不必確認框，錯誤照寫主機 message)
    async function handlePlayerUnlock() {
      const inputEl = document.getElementById('ejPlayerId');
      const pid = (inputEl.value || '').trim().toUpperCase();
      const assistMsg = document.getElementById('ejPlayerAssistMsg');
      const mainMsg = document.getElementById('ejMsg');
      assistMsg.style.display = 'none';
      if (mainMsg) mainMsg.style.display = 'none';

      if (!pid) {
        assistMsg.className = 'msg-box error';
        assistMsg.textContent = '請輸入選手編號';
        assistMsg.style.display = 'block';
        return;
      }

      const btn = document.getElementById('ejUnlock');
      btn.disabled = true;

      try {
        await callApi('/api/staff/player_unlock', {
          staff_pin: staffPin,
          player_id: pid
        });
        assistMsg.className = 'msg-box success';
        assistMsg.textContent = `選手 ${pid} 已成功解鎖，可重新登入`;
        assistMsg.style.display = 'block';
      } catch (err) {
        const errMsg = err.message || '解鎖失敗';
        assistMsg.className = 'msg-box error';
        assistMsg.textContent = errMsg;
        assistMsg.style.display = 'block';
        if (mainMsg) {
          mainMsg.className = 'msg-box error';
          mainMsg.textContent = errMsg;
          mainMsg.style.display = 'block';
        }
      } finally {
        btn.disabled = false;
      }
    }

    // 重設選手 PIN (跳出確認框寫出選手姓名，確認後送出)
    function handlePlayerPinReset() {
      const inputEl = document.getElementById('ejPlayerId');
      const pid = (inputEl.value || '').trim().toUpperCase();
      const assistMsg = document.getElementById('ejPlayerAssistMsg');
      const mainMsg = document.getElementById('ejMsg');
      assistMsg.style.display = 'none';
      if (mainMsg) mainMsg.style.display = 'none';

      if (!pid) {
        assistMsg.className = 'msg-box error';
        assistMsg.textContent = '請輸入選手編號';
        assistMsg.style.display = 'block';
        return;
      }

      const playerName = findPlayerName(pid);
      const targetName = (playerName && playerName !== pid) ? `${playerName}（${pid}）` : pid;

      showConfirm(
        '確認重設選手 PIN 碼',
        `確定要為選手「${targetName}」重設 PIN 碼嗎？重設後舊 PIN 碼將立即失效。`,
        async () => {
          const btn = document.getElementById('ejPinReset');
          btn.disabled = true;
          assistMsg.style.display = 'none';
          if (mainMsg) mainMsg.style.display = 'none';

          try {
            const res = await callApi('/api/staff/player_pin_reset', {
              staff_pin: staffPin,
              player_id: pid
            });
            showNewPlayerPin(res.pin);
          } catch (err) {
            const errMsg = err.message || '重設 PIN 失敗';
            assistMsg.className = 'msg-box error';
            assistMsg.textContent = errMsg;
            assistMsg.style.display = 'block';
            if (mainMsg) {
              mainMsg.className = 'msg-box error';
              mainMsg.textContent = errMsg;
              mainMsg.style.display = 'block';
            }
          } finally {
            btn.disabled = false;
          }
        }
      );
    }

    // 大字顯示新 PIN
    function showNewPlayerPin(pin) {
      const box = document.getElementById('ejNewPinBox');
      const pinEl = document.getElementById('ejNewPin');
      pinEl.textContent = pin;
      box.style.display = 'block';
    }

    // 已抄下按鈕：從畫面清空並隱藏，任何地方都不存 (硬性規定)
    function handleNewPinDone() {
      const box = document.getElementById('ejNewPinBox');
      const pinEl = document.getElementById('ejNewPin');
      if (pinEl) pinEl.textContent = '';
      if (box) box.style.display = 'none';
    }

    document.getElementById('ejUnlock').addEventListener('click', handlePlayerUnlock);
    document.getElementById('ejPinReset').addEventListener('click', handlePlayerPinReset);
    document.getElementById('ejNewPinDone').addEventListener('click', handleNewPinDone);

    // 頁面初始化：檢查 sessionStorage 既有登入
    window.addEventListener('DOMContentLoaded', () => {
      const savedPin = sessionStorage.getItem(SESSION_KEY_PIN);
      if (savedPin) {
        document.getElementById('ejPin').value = savedPin;
        doLogin(savedPin);
      }
    });
  </script>
</body>
</html>
