<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>符文戰場 — 大螢幕計時鐘</title>
  <style>
    :root {
      --bg: #01222F;
      --card-bg: #013951;
      --card-border: #0A5570;
      --text-primary: #F9F9F9;
      --text-secondary: #9FB8C4;
      --accent: #EF7D00;
      --accent-hover: #C86800;
      --accent-text: #FF941E;
      --warning-bg: #3E3312;
      --warning-border: #8A6D1F;
      --warning-text: #F2C94C;
      --danger-bg: #4A1F1C;
      --danger-border: #A8443C;
      --danger-text: #ED807A;
      --success-bg: #0A3F33;
      --success-border: #1F7A55;
      --success-text: #2FB574;
      --chip-bg: #0A4A63;
      --input-bg: #011A24;
      --info-bg: #1B2F4A;
      --info-border: #2F5A80;
      --info-text: #4FA8D8;
      --judge-bg: #2E2140;
      --judge-border: #553C77;
      --judge-text: #B38FE0;

      /* Aliases for clock.html */
      --panel-bg: var(--card-bg);
      --panel-border: var(--card-border);
      --text-main: var(--text-primary);
      --text-sub: var(--text-secondary);
      --warning: var(--warning-text);
      --danger: var(--danger-text);
      --success: var(--success-text);
      --note-bg: #1B2F4A;
      --note-border: #2F5A80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: Inter, system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    input, select, textarea {
      font-size: 1rem;
    }

    .wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 24px;
    }

    /* 頂部導覽列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--panel-border);
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .event-title {
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: clamp(0.75rem, 1vw, 0.95rem);
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 700;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-sub);
    }
    .status-badge.live {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }
    .status-badge.paused {
      background: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--warning-text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-fs {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-sub);
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      min-height: 44px;
    }
    .btn-fs:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    /* 版本警告 */
    .contract-warning {
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 12px;
      text-align: center;
    }
    .stale-warning {
      background: var(--danger-bg);
      color: var(--danger-text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 800;
      margin-bottom: 14px;
      text-align: center;
      border: 2px solid var(--danger-border);
    }

    /* 主辦公告列 */
    .announcement-bar {
      background: var(--note-bg);
      border: 1px solid var(--note-border);
      border-radius: 10px;
      padding: 10px 18px;
      margin-bottom: 16px;
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .announcement-tag {
      background: var(--accent);
      color: #141212;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* 主要輪次與大字休息橫幅 (DATA-CONTRACT 1.8) */
    .break-giant-banner {
      background: linear-gradient(135deg, #3E3312, #554415);
      border: 2px solid #8A6D1F;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .break-giant-title {
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 900;
      color: #F9F9F9;
      letter-spacing: 1px;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .break-giant-sub {
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      color: #F2C94C;
      font-weight: 600;
    }
    .break-giant-time {
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      color: #9FB8C4;
      margin-top: 8px;
    }

    /* 計時主區塊 */
    .clock-main-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 30px 20px;
      margin-bottom: 20px;
      position: relative;
      min-height: 280px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .round-label-badge {
      font-size: clamp(1.2rem, 2.5vw, 2.2rem);
      font-weight: 800;
      color: var(--accent-text);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .clock-giant-digits {
      font-size: clamp(4.5rem, 18vw, 15rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 0.95;
      letter-spacing: -2px;
      color: var(--text-main);
      text-align: center;
      margin: 10px 0;
      transition: color 0.3s ease;
    }
    .clock-giant-digits.warning {
      color: var(--warning);
    }
    .clock-giant-digits.danger {
      color: var(--danger);
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* 時間到 / 延長回合大字提示 */
    .extra-turns-banner {
      background: var(--danger-bg);
      border: 2px solid var(--danger-border);
      border-radius: 12px;
      padding: 14px 24px;
      text-align: center;
      margin-top: 14px;
      max-width: 900px;
      width: 100%;
    }
    .extra-turns-title {
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 900;
      color: var(--danger-text);
      margin-bottom: 4px;
    }
    .extra-turns-desc {
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      color: var(--text-primary);
    }

    /* 底部全場進度列 (DATA-CONTRACT 1.9) */
    .progress-footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .progress-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-box-label {
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      color: var(--text-sub);
    }
    .progress-box-val {
      font-size: clamp(1.3rem, 2.2vw, 2rem);
      font-weight: 800;
      color: var(--text-main);
    }
    .progress-box-sub {
      font-size: clamp(0.75rem, 1vw, 0.95rem);
      color: var(--text-sub);
    }

    /* 尚未連上賽務系統畫面 */
    .disconnected-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #01222F;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 1000;
    }
    .disconnected-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    .disconnected-title {
      font-size: clamp(1.5rem, 3vw, 2.4rem);
      font-weight: 800;
      color: var(--danger-text);
      margin-bottom: 8px;
    }
    .disconnected-desc {
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      color: var(--text-sub);
      max-width: 500px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn-retry {
      background: var(--accent);
      color: #141212;
      font-weight: 800;
      padding: 14px 36px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      min-height: 48px;
    }
    .btn-retry:active {
      background: var(--accent-hover);
    }

    /* 手機 360px 邊距適配 */
    @media (max-width: 600px) {
      .wrapper {
        padding: 10px;
      }
      .clock-main-card {
        padding: 20px 10px;
        min-height: 220px;
      }
      .progress-footer-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- 版本升級提示 -->
    <div id="contractWarn" class="contract-warning" style="display: none;">
      資料格式已更新，請重新整理頁面
    </div>

    <!-- 資料過期提示 (DATA-CONTRACT 1.10) -->
    <div id="staleBanner" class="stale-warning" style="display: none;"></div>

    <!-- 頂部賽事橫幅 -->
    <header>
      <div class="header-left">
        <div class="event-title" id="eventName">載入中...</div>
        <div class="status-badge" id="eventStatus">賽事狀態</div>
        <div class="status-badge" id="checkinBadge" style="display: none; background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border);">已報到 0 / 0</div>
        <div class="status-badge" id="decklistBadge" style="display: none; background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border);">已登錄牌表 0 / 0</div>
        <div class="status-badge" id="judgeCallsBadge" style="display: none; background: var(--judge-bg); color: var(--judge-text); border: 1px solid var(--judge-border); font-weight: 700;">0 桌在等裁判</div>
      </div>
      <div class="header-right">
        <button type="button" class="btn-fs" id="fullscreenBtn">⛶ 全螢幕</button>
      </div>
    </header>

    <!-- 公告跑馬燈/橫條 -->
    <div class="announcement-bar" id="announcementBar" style="display: none;">
      <span class="announcement-tag">現場公告</span>
      <span id="announcementText"></span>
    </div>

    <!-- 休息中大字公告 (DATA-CONTRACT 1.8) -->
    <div class="break-giant-banner" id="breakGiantBanner" style="display: none;">
      <div class="break-giant-title" id="breakGiantTitle">午休中</div>
      <div class="break-giant-sub" id="breakGiantSub">13:30 開始第 2 輪</div>
      <div class="break-giant-time" id="breakGiantTime">剛剛更新</div>
    </div>

    <!-- 計時主畫面 -->
    <main class="clock-main-card" id="clockCard">
      <div class="round-label-badge" id="roundLabel">--</div>
      <div class="clock-giant-digits" id="clockDigits">--:--</div>

      <!-- 時間到延長回合提示 (DATA-CONTRACT 1.4) -->
      <div class="extra-turns-banner" id="extraTurnsBanner" style="display: none;">
        <div class="extra-turns-title">時間到</div>
        <div class="extra-turns-desc" id="extraTurnsDesc">
          目前回合結束後，再進行 3 個回合
        </div>
      </div>
    </main>

    <!-- 底部進度網格 (DATA-CONTRACT 1.8, 1.9) -->
    <footer class="progress-footer-grid">
      <!-- 全場進度 -->
      <div class="progress-box" id="progressBox">
        <div class="progress-box-label">全場桌況進度</div>
        <div class="progress-box-val" id="progressVal">計算中...</div>
        <div class="progress-box-sub" id="progressSub">--</div>
      </div>

      <!-- 表定最晚結束時間 -->
      <div class="progress-box" id="latestEndBox">
        <div class="progress-box-label">本輪表定最晚結束</div>
        <div class="progress-box-val" id="latestEndVal">--</div>
        <div class="progress-box-sub">時間到後仍有延長回合，非保證結束時刻</div>
      </div>

      <!-- 下一輪預計時間 -->
      <div class="progress-box" id="nextRoundBox">
        <div class="progress-box-label">下一輪預計開始</div>
        <div class="progress-box-val" id="nextRoundVal">待定</div>
        <div class="progress-box-sub" id="nextRoundSub">--</div>
      </div>
    </footer>
  </div>

  <!-- 尚未連上主機畫面 (硬性規定 1) -->
  <div class="disconnected-overlay" id="disconnectedScreen">
    <div class="disconnected-icon">⚠️</div>
    <div class="disconnected-title">尚未連上賽務系統</div>
    <div class="disconnected-desc">
      大螢幕計時器目前無法讀取賽事即時資料。<br>請確認本機或區域網路連線，連線恢復後將自動重新載入。
    </div>
    <button type="button" class="btn-retry" id="retryBtn">重新連線</button>
  </div>

  <script>
    const CURRENT_CONTRACT_VERSION = 10;
    let snapshotData = null;
    let rawJsonText = '';
    let clockTimer = null;
    let pollTimer = null;
    let serverOffsetMs = 0;
    let demoOffsetCalculated = false;
    let lastContentChangeTime = Date.now();

    // 取得資料來源 URL (DATA-CONTRACT 1.10: 固定 ../snapshot.json，僅接受固定的 demo 參數)
    function getDataSourceUrl() {
      const params = new URLSearchParams(window.location.search);
      const demo = params.get('demo');
      if (demo === '1') {
        return '../sample/snapshot.sample.json';
      } else if (demo === 'break') {
        return '../sample/snapshot.break.sample.json';
      } else if (demo === 'topcut') {
        return '../sample/snapshot.topcut.sample.json';
      }
      return '../snapshot.json';
    }

    // 台灣時間 HH:MM 格式化 (Asia/Taipei)
    function formatTimeHHMM(ms) {
      if (!ms) return '待定';
      try {
        return new Intl.DateTimeFormat('zh-TW', {
          timeZone: 'Asia/Taipei',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).format(new Date(ms));
      } catch (e) {
        const d = new Date(ms);
        const hours = d.getHours().toString().padStart(2, '0');
        const minutes = d.getMinutes().toString().padStart(2, '0');
        return `${hours}:${minutes}`;
      }
    }

    // 相對時間（N 分鐘前）
    function formatRelativeMinutes(updatedMs, serverNowMs) {
      if (!updatedMs) return '';
      const diffSec = Math.max(0, Math.floor((serverNowMs - updatedMs) / 1000));
      const mins = Math.floor(diffSec / 60);
      if (mins <= 0) return '剛剛更新';
      return `${mins} 分鐘前更新`;
    }

    // 讀取資料 (DATA-CONTRACT 1.10: 時間換算優先用 Date 標頭)
    async function fetchData() {
      const primaryUrl = getDataSourceUrl();
      try {
        const responseTime = Date.now();
        let res = await fetch(primaryUrl, { cache: 'no-store' });
        if (!res.ok && primaryUrl.startsWith('../')) {
          const fallbackUrl = primaryUrl.replace(/^\.\.\//, '/');
          res = await fetch(fallbackUrl, { cache: 'no-store' });
        }
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const text = await res.text();
        const data = JSON.parse(text);

        // DATA-CONTRACT 1.10: 示範模式的時間換算
        // 示範檔的時間固定在 2026-09-26，不讀 Date 標頭，只在第一次載入時用 server_now 算一次 offset，之後不再重算
        const isDemo = !!new URLSearchParams(window.location.search).get('demo');
        if (isDemo) {
          if (!demoOffsetCalculated && data.server_now) {
            serverOffsetMs = data.server_now - responseTime;
            demoOffsetCalculated = true;
          }
        } else {
          // 正式模式：計算時間差 offset（優先 Date 標頭，次選 server_now，每次成功讀取皆重算）
          let dateHeaderMs = null;
          try {
            const dateHeader = res.headers.get('Date');
            if (dateHeader) {
              const t = new Date(dateHeader).getTime();
              if (!isNaN(t)) dateHeaderMs = t;
            }
          } catch (e) {}

          if (dateHeaderMs !== null) {
            serverOffsetMs = dateHeaderMs - responseTime;
          } else if (data.server_now) {
            serverOffsetMs = data.server_now - responseTime;
          }
        }

        document.getElementById('disconnectedScreen').style.display = 'none';

        // 避免無變動時重繪 DOM
        if (text === rawJsonText) {
          return;
        }

        lastContentChangeTime = Date.now();
        rawJsonText = text;
        snapshotData = data;
        renderAll();
      } catch (err) {
        console.warn('大螢幕讀取賽事資料失敗:', err);
        if (!snapshotData) {
          document.getElementById('disconnectedScreen').style.display = 'flex';
        }
      }
    }

    // 檢查資料新鮮度 (DATA-CONTRACT 1.10: 超過90秒沒收到新內容顯示警告，示範模式不檢查)
    function checkFreshness() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('demo')) return;
      const staleEl = document.getElementById('staleBanner');
      if (!staleEl) return;
      const diffMs = Date.now() - lastContentChangeTime;
      if (diffMs > 90000) {
        const mins = Math.max(1, Math.floor(diffMs / 60000));
        staleEl.textContent = `資料已 ${mins} 分鐘沒更新，請留意現場廣播`;
        staleEl.style.display = 'block';
      } else {
        staleEl.style.display = 'none';
      }
    }

    function renderAll() {
      if (!snapshotData) return;

      renderVersionWarning();
      renderEventInfo();
      renderAnnouncement();
      renderScheduleAndBreak();
      renderProgressFooter();
      updateClockDisplay();
    }

    // 檢查版本號 (DATA-CONTRACT 1.1)
    function renderVersionWarning() {
      const warnEl = document.getElementById('contractWarn');
      if (snapshotData.contract_version && snapshotData.contract_version > CURRENT_CONTRACT_VERSION) {
        warnEl.style.display = 'block';
      } else {
        warnEl.style.display = 'none';
      }
    }

    // 賽事標題與狀態
    function renderEventInfo() {
      const event = snapshotData.event || {};
      document.getElementById('eventName').textContent = event.name || '符文戰場賽事';

      const statusEl = document.getElementById('eventStatus');
      const st = event.status || 'live';
      statusEl.className = 'status-badge';
      if (st === 'live') {
        statusEl.classList.add('live');
        statusEl.textContent = '進行中';
      } else if (st === 'paused') {
        statusEl.classList.add('paused');
        statusEl.textContent = '暫停中';
      } else if (st === 'done') {
        statusEl.textContent = '已結束';
      } else {
        statusEl.textContent = '未開始';
      }

      // 現場報到與牌表狀態 (DATA-CONTRACT 1.12)
      const checkinEl = document.getElementById('checkinBadge');
      const decklistEl = document.getElementById('decklistBadge');
      if (checkinEl) {
        if (event.checkin && event.checkin.open) {
          checkinEl.style.display = 'inline-flex';
          checkinEl.textContent = `已報到 ${event.checkin.checked_in} / ${event.checkin.total}`;
          if (decklistEl && event.checkin.decklist_required) {
            decklistEl.style.display = 'inline-flex';
            decklistEl.textContent = `已登錄牌表 ${event.checkin.decklists || 0} / ${event.checkin.total}`;
          } else if (decklistEl) {
            decklistEl.style.display = 'none';
          }
        } else {
          checkinEl.style.display = 'none';
          if (decklistEl) {
            decklistEl.style.display = 'none';
          }
        }
      }

      // 裁判呼叫狀態 (DATA-CONTRACT 1.15)
      const judgeCallsBadge = document.getElementById('judgeCallsBadge');
      if (judgeCallsBadge) {
        const waitingCalls = (snapshotData.round && snapshotData.round.progress && typeof snapshotData.round.progress.judge_calls_waiting === 'number')
          ? snapshotData.round.progress.judge_calls_waiting
          : 0;
        if (waitingCalls > 0) {
          judgeCallsBadge.style.display = 'inline-flex';
          judgeCallsBadge.textContent = `${waitingCalls} 桌在等裁判`;
        } else {
          judgeCallsBadge.style.display = 'none';
        }
      }
    }

    // 主辦公告 (event.note)
    function renderAnnouncement() {
      const event = snapshotData.event || {};
      const note = (event.note || '').trim();
      const bar = document.getElementById('announcementBar');
      const text = document.getElementById('announcementText');

      if (note) {
        bar.style.display = 'flex';
        text.textContent = note;
      } else {
        bar.style.display = 'none';
      }
    }

    // 休息中大字公告 (DATA-CONTRACT 1.8)
    function renderScheduleAndBreak() {
      if (!snapshotData) return;
      const sched = snapshotData.schedule || {};
      const breakBanner = document.getElementById('breakGiantBanner');
      const serverNow = Date.now() + serverOffsetMs;

      if (sched.break && sched.break.label) {
        breakBanner.style.display = 'block';
        const targetMs = sched.next_round_at || sched.break.until;
        const targetStr = formatTimeHHMM(targetMs);
        const nextRoundNum = (snapshotData.round ? snapshotData.round.number + 1 : 1);
        let nextStageName = `第 ${nextRoundNum} 輪`;
        if (snapshotData.round && snapshotData.round.stage === 'top_cut') {
          nextStageName = snapshotData.round.label || '淘汰賽';
        }

        const isPast = targetMs && (serverNow > targetMs);
        if (isPast) {
          document.getElementById('breakGiantTitle').textContent = `${sched.break.label}中 · 預計時間已過`;
          document.getElementById('breakGiantSub').textContent = `${nextStageName}即將公布，請選手回到座位區`;
        } else {
          document.getElementById('breakGiantTitle').textContent = `${sched.break.label}中 · ${targetStr} 開始${nextStageName}`;
          document.getElementById('breakGiantSub').textContent = `預計 ${targetStr} 開始${nextStageName}`;
        }

        const updatedStr = formatRelativeMinutes(sched.updated_at, serverNow);
        document.getElementById('breakGiantTime').textContent = updatedStr;
      } else {
        breakBanner.style.display = 'none';
      }
    }

    // 底部全場桌數進度、表定最晚結束、下一輪預計時間 (DATA-CONTRACT 1.8, 1.9)
    function renderProgressFooter() {
      if (!snapshotData) return;
      const round = snapshotData.round;
      const sched = snapshotData.schedule || {};
      const serverNow = Date.now() + serverOffsetMs;

      // 1. 全場桌況進度
      const progressVal = document.getElementById('progressVal');
      const progressSub = document.getElementById('progressSub');
      if (round && round.progress && typeof round.progress.tables_total === 'number') {
        const total = round.progress.tables_total;
        const done = round.progress.tables_done || 0;
        const remaining = Math.max(0, total - done);
        progressVal.textContent = `全場還剩 ${remaining} 桌`;
        progressSub.textContent = `已完賽 ${done} 桌 / 共 ${total} 桌`;
      } else {
        progressVal.textContent = '計算中...';
        progressSub.textContent = '--';
      }

      // 2. 本輪表定最晚結束
      const latestEndVal = document.getElementById('latestEndVal');
      if (round && round.progress && round.progress.latest_end_at && snapshotData.clock && snapshotData.clock.state === 'running') {
        const tStr = formatTimeHHMM(round.progress.latest_end_at);
        latestEndVal.textContent = `最晚約 ${tStr}`;
      } else {
        latestEndVal.textContent = '待定';
      }

      // 3. 下一輪預計開始
      const nextRoundVal = document.getElementById('nextRoundVal');
      const nextRoundSub = document.getElementById('nextRoundSub');
      if (sched.next_round_at) {
        if (serverNow > sched.next_round_at) {
          nextRoundVal.textContent = '預計時間已過';
          nextRoundSub.textContent = '請留意現場廣播';
        } else {
          nextRoundVal.textContent = formatTimeHHMM(sched.next_round_at);
          const uStr = formatRelativeMinutes(sched.updated_at, serverNow);
          nextRoundSub.textContent = uStr ? `主辦方 ${uStr}` : '主辦方已排定';
        }
      } else if (sched.break && sched.break.until) {
        if (serverNow > sched.break.until) {
          nextRoundVal.textContent = '預計時間已過';
          nextRoundSub.textContent = '請留意現場廣播';
        } else {
          nextRoundVal.textContent = formatTimeHHMM(sched.break.until);
          nextRoundSub.textContent = `${sched.break.label}結束時間`;
        }
      } else {
        nextRoundVal.textContent = '待定';
        nextRoundSub.textContent = '尚未公布預計時刻';
      }
    }

    // 每秒計時鐘刷新
    function updateClockDisplay() {
      if (!snapshotData) return;
      const round = snapshotData.round;
      const clock = snapshotData.clock || {};

      const roundLabelEl = document.getElementById('roundLabel');
      const clockDigitsEl = document.getElementById('clockDigits');
      const extraTurnsBanner = document.getElementById('extraTurnsBanner');
      const extraTurnsDesc = document.getElementById('extraTurnsDesc');

      if (!round) {
        roundLabelEl.style.display = '';
        roundLabelEl.textContent = '賽事準備中';
        clockDigitsEl.textContent = '--:--';
        clockDigitsEl.className = 'clock-giant-digits';
        extraTurnsBanner.style.display = 'none';
        return;
      }

      // 配對公布狀態與階段檢查 (DATA-CONTRACT 1.3: phase)
      if (round.phase === 'finished') {
        roundLabelEl.style.display = 'none';
        clockDigitsEl.textContent = `${round.label || ('第 ' + round.number + ' 輪')} 已結束`;
        clockDigitsEl.style.fontSize = 'clamp(2.5rem, 8vw, 7rem)';
        clockDigitsEl.style.color = '#34d399';
        extraTurnsBanner.style.display = 'none';
        return;
      }

      roundLabelEl.style.display = '';
      if (round.published === false || round.phase === 'pairing') {
        roundLabelEl.textContent = `${round.label || '本輪'} · 配對產生中`;
      } else {
        roundLabelEl.textContent = round.label || `第 ${round.number} 輪`;
      }

      extraTurnsBanner.style.display = 'none';
      clockDigitsEl.className = 'clock-giant-digits';
      clockDigitsEl.style.color = 'var(--text-main)';

      if (clock.state === 'not_started') {
        clockDigitsEl.textContent = '未開始';
        clockDigitsEl.style.fontSize = 'clamp(3rem, 10vw, 8rem)';
      } else if (clock.state === 'paused') {
        const sec = clock.remaining_sec || 0;
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        clockDigitsEl.textContent = `暫停中 ${m}:${s}`;
        clockDigitsEl.classList.add('warning');
        clockDigitsEl.style.fontSize = 'clamp(3rem, 11vw, 9rem)';
      } else if (clock.state === 'time_up') {
        clockDigitsEl.textContent = '00:00';
        clockDigitsEl.classList.add('danger');
        clockDigitsEl.style.fontSize = 'clamp(4.5rem, 18vw, 15rem)';
        extraTurnsBanner.style.display = 'block';
        const extraTurns = typeof clock.extra_turns === 'number' ? clock.extra_turns : 3;
        if (extraTurns > 0) {
          extraTurnsDesc.style.display = 'block';
          extraTurnsDesc.textContent = `時間到！目前回合結束後，再進行 ${extraTurns} 個回合`;
        } else {
          extraTurnsDesc.style.display = 'none';
          extraTurnsDesc.textContent = '';
        }
      } else if (clock.state === 'running') {
        clockDigitsEl.style.fontSize = 'clamp(4.5rem, 18vw, 15rem)';
        if (!clock.ends_at) {
          clockDigitsEl.textContent = '進行中';
          return;
        }

        const currentServerNow = Date.now() + serverOffsetMs;
        const diffMs = clock.ends_at - currentServerNow;

        if (diffMs <= 0) {
          clockDigitsEl.textContent = '00:00';
          clockDigitsEl.classList.add('danger');
          extraTurnsBanner.style.display = 'block';
          const extraTurns = typeof clock.extra_turns === 'number' ? clock.extra_turns : 3;
          if (extraTurns > 0) {
            extraTurnsDesc.style.display = 'block';
            extraTurnsDesc.textContent = `時間到！目前回合結束後，再進行 ${extraTurns} 個回合`;
          } else {
            extraTurnsDesc.style.display = 'none';
            extraTurnsDesc.textContent = '';
          }
        } else {
          const totalSec = Math.floor(diffMs / 1000);
          const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
          const s = (totalSec % 60).toString().padStart(2, '0');
          clockDigitsEl.textContent = `${m}:${s}`;

          if (totalSec < 300) {
            clockDigitsEl.classList.add('warning');
          }
        }
      }
    }

    // 全螢幕 API 偵測與切換 (PROJECT.md 第 10 節)
    function isFullscreenSupported() {
      const el = document.documentElement;
      return !!(el && (el.requestFullscreen || el.webkitRequestFullscreen));
    }

    function toggleFullScreen() {
      const doc = document;
      const el = doc.documentElement;
      const isFs = !!(doc.fullscreenElement || doc.webkitFullscreenElement);
      try {
        if (!isFs) {
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) {
            const p = req.call(el);
            if (p && p.catch) p.catch(err => console.log(err));
          }
        } else {
          const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
          if (exit) {
            const p = exit.call(doc);
            if (p && p.catch) p.catch(err => console.log(err));
          }
        }
      } catch (err) {
        console.log(err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const fsBtn = document.getElementById('fullscreenBtn');
      if (fsBtn) {
        if (!isFullscreenSupported()) {
          fsBtn.style.display = 'none';
        } else {
          fsBtn.addEventListener('click', toggleFullScreen);
        }
      }

      const retryBtn = document.getElementById('retryBtn');
      if (retryBtn) {
        retryBtn.addEventListener('click', fetchData);
      }

      fetchData();
      pollTimer = setInterval(fetchData, 5000);
      clockTimer = setInterval(() => {
        updateClockDisplay();
        renderScheduleAndBreak();
        renderProgressFooter();
        checkFreshness();
      }, 1000);
    });
  </script>
</body>
